name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash
          POSTGRES_DB: dashboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dash -d dashboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dash:dash@localhost:5432/dashboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-auth-secret-0123456789abcdef
      - run: npm audit --omit=dev --audit-level=high
